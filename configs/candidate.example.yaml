# Copy to candidate.yaml and point to your trained checkpoints.
vehicle_weights: ../runtime/training/vehicle-001/fit/weights/best.pt
logo_weights: ../models/logo.pt
plate_weights: ../models/best_stripped.onnx
# Keep the current Vietnam OCR baseline. Switch to crnn only after comparing evaluation results.
ocr_engine: cct
ocr_weights: ../models/ocr_model.onnx
ocr_config: ../models/ocr_model.yaml
model_version: candidate-001
device: cpu
# Must match the exact annotation taxonomy of the vehicle checkpoint.
vehicle_classes:
  0: Ô tô con
  1: Xe máy
  2: Xe buýt
  3: Xe tải
detector_confidence: 0.2
sample_interval_seconds: 0.5
track_timeout_seconds: 2.0
