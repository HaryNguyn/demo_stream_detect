# Paths are relative to this YAML file.
vehicle_weights: ../models/yolo11n.pt
logo_weights: ../models/logo.pt
plate_weights: ../models/best_stripped.onnx
ocr_engine: cct
ocr_weights: ../models/ocr_model.onnx
ocr_config: ../models/ocr_model.yaml
model_version: vietnam-ocr-logo26-vnocr-plate640-001
device: cpu
vehicle_classes:
  2: Ô tô con
  3: Xe máy
  5: Xe buýt
  7: Xe tải
detector_confidence: 0.2
sample_interval_seconds: 0.5
track_timeout_seconds: 2.0
# Recognition budget per inference frame (preview runs independently).
detector_imgsz: 640
detector_half: false
max_recognitions_per_frame: 2
min_vehicle_width: 120
min_plate_width: 32
# 0 disables sharpness filtering; tune for the camera resolution.
min_plate_sharpness: 0
plate_confirm_reads: 3
plate_confirm_score: 3.0
plate_confirm_mean: 0.85
crop_vehicle_roi: true
vehicle_roi_padding: 0.05
plate_imgsz: 640
# 1.0 searches the whole car; try 0.6 after measuring missed plates.
plate_lower_fraction: 1.0
plate_reuse_padding: 0.3
plate_full_scan_interval: 5
ocr_top_k: 4
ocr_threads: 4
ocr_batch_size: 8
min_image_quality: 0.5
min_evidence_detection: 0.6
min_evidence_ocr: 0.85
evidence_top_k: 5
keep_low_confidence: true
# /api/events và CSV chỉ trả xe có chuỗi biển số.
plates_only: true
plate_confirm_margin: 1.0
# Additional relative-share check is disabled to preserve the current baseline.
plate_confirm_share: 0.0
type_confirm_reads: 3
type_confirm_mean: 0.7
type_confirm_share: 0.7
brand_confirm_reads: 3
brand_confirm_mean: 0.7
brand_confirm_share: 0.7
quality_target_width: 100
quality_target_height: 32
quality_target_sharpness: 150
quality_edge_margin: 2
quality_expected_ratios: [1.4, 4.5]
