services:
  inference:
    build: .
    image: vehicle-ai:0.1.0-cpu
    init: true
    volumes:
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ./runtime:/app/runtime
    command: ["python", "-m", "vehicle_ai", "--help"]

  ui:
    profiles: ["ui"]
    build: .
    image: vehicle-ai:0.1.0-cpu
    init: true
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file: .env
    environment:
      VDTC_IMAGE_ROOT: /app/runtime/images
    volumes:
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
      - ./runtime:/app/runtime
    command: ["python", "app.py", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
