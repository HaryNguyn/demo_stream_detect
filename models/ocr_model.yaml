# Config for the fine-tuned Vietnam plate OCR (CCT character slots).
# Alphabet replaces W with '-' relative to the previous OCR model.
max_plate_slots: 10
alphabet: '0123456789ABCDEFGHIJKLMNOPQRSTUVXYZ-_'
pad_char: '_'
img_height: 64
img_width: 128
keep_aspect_ratio: false
interpolation: linear
image_color_mode: rgb
plate_regions: ['Vietnam']
