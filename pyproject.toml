[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-ai"
version = "0.1.0"
description = "Vehicle event recognition, training and evaluation toolkit"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["ruff>=0.8,<1"]

[project.scripts]
vehicle-ai = "vehicle_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vehicle_ai = ["roi_component/*.html"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv312", "data", "models", "runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
