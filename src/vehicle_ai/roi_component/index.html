<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
body{margin:0;font:14px system-ui,sans-serif;color:#172b4d}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
button,select{padding:8px 12px;border:1px solid #bac5d4;border-radius:6px;background:#fff;cursor:pointer}
button.primary{background:#1663d6;color:white;border:0}
canvas{display:block;width:100%;max-width:1100px;touch-action:none;cursor:crosshair;background:#111;border-radius:6px}
#message{padding:8px 0;min-height:20px}
</style>
</head>
<body>
<div class="bar">
<label>Kiểu vẽ <select id="mode"><option value="rectangle">Hình chữ nhật — kéo chuột</option><option value="polygon">Đa giác — bấm từng đỉnh</option></select></label>
<button id="undo">Bỏ điểm cuối</button><button id="reset">Vẽ lại</button>
<button id="save" class="primary">Lưu ROI cho video</button><button id="clear">Bỏ ROI / dùng toàn ảnh</button>
</div>
<canvas id="canvas"></canvas>
<div id="message">Kéo chuột trên ảnh để chọn vùng. Bấm Lưu ROI khi hoàn tất.</div>
<script>
const canvas=document.getElementById("canvas"), ctx=canvas.getContext("2d");
const message=document.getElementById("message"), mode=document.getElementById("mode");
const image=new Image(); let points=[], start=null, contextId=null, imageData=null;
const post=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},"*");
const height=()=>post("streamlit:setFrameHeight",{height:document.body.scrollHeight+8});
function render(){
 if(!image.complete||!image.naturalWidth)return;
 canvas.width=Math.min(image.naturalWidth,1100);
 canvas.height=Math.round(image.naturalHeight*canvas.width/image.naturalWidth);
 ctx.drawImage(image,0,0,canvas.width,canvas.height);
 if(points.length){
  ctx.beginPath(); points.forEach((p,i)=>i?ctx.lineTo(p[0]*canvas.width,p[1]*canvas.height):ctx.moveTo(p[0]*canvas.width,p[1]*canvas.height));
  if(points.length>2)ctx.closePath();
  ctx.fillStyle="rgba(255,193,7,0.18)";if(points.length>2)ctx.fill();
  ctx.strokeStyle="#ffc107";ctx.lineWidth=3;ctx.stroke();
  points.forEach((p,i)=>{ctx.beginPath();ctx.arc(p[0]*canvas.width,p[1]*canvas.height,5,0,2*Math.PI);
   ctx.fillStyle="#ffc107";ctx.fill();ctx.font="bold 15px sans-serif";ctx.fillText(i+1,p[0]*canvas.width+8,p[1]*canvas.height-8);});
 }
 height();
}
function position(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))];}
function rectangle(end){const x1=Math.min(start[0],end[0]),y1=Math.min(start[1],end[1]),x2=Math.max(start[0],end[0]),y2=Math.max(start[1],end[1]);points=[[x1,y1],[x2,y1],[x2,y2],[x1,y2]];}
canvas.addEventListener("pointerdown",e=>{
 if(!image.complete)return;
 canvas.setPointerCapture(e.pointerId);
 if(mode.value==="rectangle"){start=position(e);points=[];}
 else {points.push(position(e));render();}
});
canvas.addEventListener("pointermove",e=>{if(start){rectangle(position(e));render();}});
canvas.addEventListener("pointerup",e=>{if(start){rectangle(position(e));start=null;render();}if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);});
canvas.addEventListener("pointercancel",()=>{start=null;});
document.getElementById("undo").onclick=()=>{points.pop();render();};
document.getElementById("reset").onclick=()=>{points=[];start=null;render();message.textContent="Vẽ vùng mới rồi bấm Lưu ROI.";};
function submit(value){
 post("streamlit:setComponentValue",{dataType:"json",value:{points:value,context:contextId,nonce:Date.now()+"-"+Math.random()}});
 message.textContent="Đã gửi thay đổi. Xem trạng thái lưu bên dưới ảnh.";
}
document.getElementById("save").onclick=()=>{
 if(points.length<3){message.textContent="ROI cần ít nhất 3 điểm.";return;}
 submit(points);
};
document.getElementById("clear").onclick=()=>{points=[];render();submit([]);};
image.onload=render;
window.addEventListener("message",event=>{
 if(event.source!==window.parent||event.data.type!=="streamlit:render")return;
 const args=event.data.args;
 if(args.context!==contextId){contextId=args.context;points=args.points||[];}
 if(args.image!==imageData){imageData=args.image;image.src=args.image;}else render();
});
window.addEventListener("resize",height);
post("streamlit:componentReady",{apiVersion:1});
height();
</script>
</body></html>
